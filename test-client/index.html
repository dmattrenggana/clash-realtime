<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clash-Onchain Real-Time Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a; color: #eee;
      padding: 20px; min-height: 100vh;
    }
    h1 { text-align: center; margin-bottom: 10px; font-size: 1.5rem; }
    .status { text-align: center; margin-bottom: 20px; font-size: 0.9rem; }
    .status.connected { color: #4ade80; }
    .status.disconnected { color: #f87171; }
    .container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1100px; margin: 0 auto; }
    .player {
      background: #1a1a1a; border: 1px solid #333; border-radius: 8px;
      padding: 16px;
    }
    .player.team-0 { border-color: #60a5fa; }
    .player.team-1 { border-color: #f87171; }
    .player h2 { font-size: 1.1rem; margin-bottom: 10px; }
    .stat { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #2a2a2a; }
    .stat:last-child { border-bottom: none; }
    .stat-label { color: #888; }
    .stat-value { font-weight: 600; }
    .elixir-bar {
      height: 8px; background: #2a2a2a; border-radius: 4px; overflow: hidden; margin-top: 6px;
    }
    .elixir-fill {
      height: 100%; background: linear-gradient(90deg, #a855f7, #ec4899);
      transition: width 0.3s;
    }
    .towers { margin-top: 12px; }
    .tower {
      display: flex; justify-content: space-between; padding: 4px 8px;
      background: #0a0a0a; border-radius: 4px; margin-bottom: 4px;
    }
    .tower.dead { opacity: 0.3; text-decoration: line-through; }
    .cards { margin-top: 20px; max-width: 1100px; margin-left: auto; margin-right: auto; }
    .cards h3 { margin-bottom: 10px; }
    .card-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .card-btn {
      padding: 10px 6px; background: #1a1a1a; border: 1px solid #333;
      border-radius: 6px; cursor: pointer; color: #eee; font-size: 0.85rem;
      transition: all 0.15s;
    }
    .card-btn:hover:not(:disabled) { background: #2a2a2a; border-color: #60a5fa; }
    .card-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .card-btn .cost {
      display: block; font-size: 0.7rem; color: #a855f7; margin-top: 2px;
    }
    .events { margin-top: 20px; max-width: 1100px; margin-left: auto; margin-right: auto; }
    .events h3 { margin-bottom: 10px; }
    .event-log {
      background: #0a0a0a; border: 1px solid #2a2a2a; border-radius: 6px;
      padding: 10px; max-height: 200px; overflow-y: auto;
      font-family: monospace; font-size: 0.8rem;
    }
    .event-log .ev { padding: 2px 0; color: #888; }
    .ev-info { color: #4ade80; }
    .ev-warn { color: #facc15; }
    .ev-err  { color: #f87171; }
  </style>
</head>
<body>
  <h1>⚔️ Clash-Onchain Real-Time</h1>
  <div class="status disconnected" id="status">Disconnected — click Connect</div>

  <div style="text-align: center; margin-bottom: 20px;">
    <input type="text" id="wallet" placeholder="0xYourWallet" value="0xTEST" style="padding: 8px; background: #0a0a0a; border: 1px solid #333; color: #eee; border-radius: 4px; width: 280px;">
    <button id="connectBtn" style="padding: 8px 16px; background: #60a5fa; border: none; color: #0a0a0a; border-radius: 4px; cursor: pointer; margin-left: 8px; font-weight: 600;">Connect</button>
  </div>

  <div class="container" id="players"></div>

  <div class="cards" id="cardsSection" style="display: none;">
    <h3>Deploy Card (cost in elixir)</h3>
    <div class="card-grid" id="cardGrid"></div>
  </div>

  <div class="events">
    <h3>Event Log</h3>
    <div class="event-log" id="eventLog"></div>
  </div>

  <script type="module">
    import { Client } from "https://unpkg.com/@colyseus/sdk@0.17.17/build/index.mjs";

    const CARDS = [
      { id: "knight",      cost: 3, name: "Knight" },
      { id: "archer",      cost: 2, name: "Archer" },
      { id: "giant",       cost: 5, name: "Giant" },
      { id: "wyvern",      cost: 4, name: "Wyvern" },
      { id: "wizard",      cost: 4, name: "Wizard" },
      { id: "goblin",      cost: 2, name: "Goblin" },
      { id: "barbarian",   cost: 3, name: "Barbarian" },
      { id: "healer",      cost: 4, name: "Healer" },
      { id: "gunslinger",  cost: 4, name: "Gunslinger" },
      { id: "barrel_bomb", cost: 2, name: "Barrel" },
      { id: "meteor",      cost: 3, name: "Meteor" },
      { id: "incubus",     cost: 2, name: "Incubus" },
    ];

    const SERVER_URL = "wss://clash-realtime-ws-xxx.run.app";
    // Update this once you have a real domain or use ws://34.67.151.45:2567 for testing
    const TEST_URL = "ws://34.67.151.45:2567";

    const statusEl = document.getElementById("status");
    const connectBtn = document.getElementById("connectBtn");
    const walletEl = document.getElementById("wallet");
    const playersEl = document.getElementById("players");
    const cardsSection = document.getElementById("cardsSection");
    const cardGrid = document.getElementById("cardGrid");
    const eventLog = document.getElementById("eventLog");

    let client = null, room = null, mySessionId = null;

    function log(msg, type = "info") {
      const div = document.createElement("div");
      div.className = `ev ev-${type}`;
      const ts = new Date().toLocaleTimeString();
      div.textContent = `[${ts}] ${msg}`;
      eventLog.prepend(div);
    }

    function renderPlayers(state) {
      playersEl.innerHTML = "";
      state.players.forEach((p, id) => {
        const isMe = id === mySessionId;
        const div = document.createElement("div");
        div.className = `player team-${p.team}`;
        const towers = p.towers.map(t => `
          <div class="tower ${t.hp <= 0 ? "dead" : ""}">
            <span>${t.type === "king" ? "👑" : "🗼"} ${t.type}</span>
            <span>${t.hp} / ${t.maxHp}</span>
          </div>
        `).join("");

        div.innerHTML = `
          <h2>${isMe ? "🟢 You" : "🔴 Opponent"} — Team ${p.team}</h2>
          <div class="stat"><span class="stat-label">Wallet</span><span class="stat-value">${p.walletAddress.slice(0, 10)}...</span></div>
          <div class="stat"><span class="stat-label">Elixir</span><span class="stat-value">${p.elixir.toFixed(1)}/10</span></div>
          <div class="elixir-bar"><div class="elixir-fill" style="width: ${(p.elixir / 10) * 100}%"></div></div>
          <div class="stat"><span class="stat-label">Units deployed</span><span class="stat-value">${p.units.length}</span></div>
          <div class="towers">${towers}</div>
        `;
        playersEl.appendChild(div);
      });
    }

    function renderCards(myElixir) {
      cardGrid.innerHTML = "";
      CARDS.forEach(c => {
        const btn = document.createElement("button");
        btn.className = "card-btn";
        btn.disabled = myElixir < c.cost;
        btn.innerHTML = `${c.name}<span class="cost">⚡${c.cost}</span>`;
        btn.onclick = () => {
          if (!room) return;
          room.send("deployCard", { cardId: c.id, x: Math.random() * 10 - 5, z: Math.random() * 10 - 5 });
          log(`Deployed ${c.name}`, "info");
        };
        cardGrid.appendChild(btn);
      });
    }

    async function connect() {
      const wallet = walletEl.value || "0xANON";
      client = new Client(TEST_URL);
      try {
        log(`Connecting to ${TEST_URL}...`);
        room = await client.joinOrCreate("battle", { wallet });
        mySessionId = room.sessionId;
        statusEl.textContent = `Connected (session ${mySessionId.slice(0, 6)}) — waiting for opponent...`;
        statusEl.className = "status connected";
        log(`Joined room battle, sessionId=${mySessionId}`, "info");
        cardsSection.style.display = "block";

        room.onStateChange((state) => {
          if (state.status === "playing" && state.players.size === 2) {
            statusEl.textContent = `Battle in progress — ${state.elapsedSec}s elapsed`;
          }
          const me = state.players.get(mySessionId);
          if (me) renderCards(me.elixir);
          renderPlayers(state);
        });

        room.onMessage("error", (m) => log(`Server: ${m.message}`, "warn"));
        room.onMessage("matchEnd", (m) => {
          log(`MATCH ENDED! Winner: Team ${m.winnerTeam} (duration ${m.duration}s)`, "info");
          statusEl.textContent = `Match ended — Winner: Team ${m.winnerTeam}`;
        });

        room.onLeave(() => {
          statusEl.textContent = "Disconnected from room";
          statusEl.className = "status disconnected";
          log("Left room", "warn");
        });
      } catch (e) {
        log(`Connection failed: ${e.message}`, "err");
        statusEl.textContent = `Failed: ${e.message}`;
        statusEl.className = "status disconnected";
      }
    }

    connectBtn.onclick = connect;
    log("Ready. Click Connect to join battle room.", "info");
  </script>
</body>
</html>
